apiVersion: apps/v1
kind: Deployment
metadata:
  name: leave-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leave-v2
  template:
    metadata:
      labels:
        app: leave-v2
    spec:
      containers:
        - name: leave-system
          image: YOUR_DOCKERHUB_USERNAME/leave-system:v2
          ports:
            - containerPort: 5000
